<style>
:root{--ink:#0f1b2d;--mut:#55627a;--bg:#f2f5fb;--pan:#fff;--line:#d3dbe9;--cob:#2347c5;--cobt:#e5ecff;--gold:#ffb703;--ok:#1e8e5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf0fb;--mut:#9fb0cc;--bg:#0c1424;--pan:#141f35;--line:#2a3a58;--cob:#7f9cff;--cobt:#1b2a52;--ok:#4cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#eaf0fb;--mut:#9fb0cc;--bg:#0c1424;--pan:#141f35;--line:#2a3a58;--cob:#7f9cff;--cobt:#1b2a52;--ok:#4cc58a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Mukta","Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.sub{margin:0;color:var(--mut);max-width:52ch}
.lang{display:flex;flex-wrap:wrap;gap:6px}
.lang button{font:600 16px inherit;font-family:inherit;padding:8px 14px;border:2px solid var(--line);background:var(--pan);color:var(--ink);border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--cob);border-color:var(--cob);color:#fff}
.grid{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.side{position:sticky;top:16px}}
section{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{font-size:21px;margin:0 0 4px;font-weight:800}
.hint{color:var(--mut);font-size:15px;margin:0 0 14px}
label{display:block;font-weight:600;font-size:15px;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.two{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 15px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.chip[aria-pressed=true]{background:var(--cobt);border-color:var(--cob);color:var(--cob)}
.chip.rm::after{content:" ×"}
.item{border:1px dashed var(--line);border-radius:12px;padding:4px 14px 14px;margin-bottom:12px}
.btn{font:700 16px inherit;font-family:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--cob);color:#fff}
.btn.sec{background:transparent;color:var(--cob);border:2px solid var(--cob)}
.btn.link{background:none;color:var(--mut);padding:6px 0;text-decoration:underline}
.row{display:flex;gap:8px}
.badge{background:var(--ink);color:var(--bg);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.badge .top{background:var(--cob);color:#fff;padding:22px 18px 14px;position:relative}
.badge .top::before{content:"";position:absolute;left:50%;top:8px;width:54px;height:8px;margin-left:-27px;border-radius:8px;background:rgba(255,255,255,.45)}
.av{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#0f1b2d;display:grid;place-items:center;font-size:26px;font-weight:800;margin-bottom:8px}
.badge h3{margin:0;font-size:22px;line-height:1.2}
.badge .lv{display:inline-block;margin-top:6px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600}
.badge .bd{padding:14px 18px 18px;font-size:15px}
.badge .bd p{margin:0 0 10px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.tags span{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 8px;font-size:13.5px}
.meter{height:8px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden;margin:4px 0 4px}
.meter i{display:block;height:100%;background:var(--gold);transition:width .3s}
.note{font-size:13.5px;color:var(--mut);margin-top:10px}
[hidden]{display:none!important}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;color:var(--cob)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

h1:["Your work profile","आपकी कार्य प्रोफ़ाइल","तुमची कामाची प्रोफाइल"],
sub:["Tell recruiters who you are and what you can do. A degree is not required. You can type in any language.","रिक्रूटर को बताइए कि आप कौन हैं और क्या कर सकते हैं। डिग्री ज़रूरी नहीं। आप किसी भी भाषा में लिख सकते हैं।","रिक्रूटरला सांगा तुम्ही कोण आहात आणि काय करू शकता. पदवी आवश्यक नाही. तुम्ही कोणत्याही भाषेत लिहू शकता."],
sub2:["Degree or no degree, fresher or experienced: everyone can submit a profile to find better jobs and get matched quickly with recruiters’ needs. You can type in any language.","डिग्री हो या नहीं, फ्रेशर हों या अनुभवी: हर कोई बेहतर नौकरी के लिए प्रोफ़ाइल जमा कर सकता है और रिक्रूटर की ज़रूरत से जल्दी मैच पा सकता है। आप किसी भी भाषा में लिख सकते हैं।","पदवी असो वा नसो, फ्रेशर असो वा अनुभवी: प्रत्येकजण चांगल्या नोकरीसाठी प्रोफाइल सादर करू शकतो आणि रिक्रूटरच्या गरजेशी लवकर मॅच मिळवू शकतो. तुम्ही कोणत्याही भाषेत लिहू शकता."],

h4:["Pick all that fit. Choose “Any work” if you are ready to learn on the job.","जो ठीक लगे सब चुनें। अगर आप काम करते हुए सीखने को तैयार हैं तो “कोई भी काम” चुनें।","जे योग्य वाटेल ते निवडा. काम करता करता शिकायला तयार असाल तर “कोणतेही काम” निवडा."],

s8:["Industry knowledge","उद्योग का ज्ञान","उद्योगाचे ज्ञान"],
h8:["Your job title may be “operations”, but what do you know about the industry? Machines, processes, rules, suppliers, customers, pricing, safety. Recruiters use this to match you to better roles and higher pay. Skip it if it does not apply.","आपका पद “ऑपरेशंस” हो सकता है, पर उद्योग के बारे में आप क्या जानते हैं? मशीनें, प्रक्रिया, नियम, सप्लायर, ग्राहक, कीमतें, सुरक्षा। रिक्रूटर इससे आपको बेहतर काम और ज़्यादा वेतन के लिए चुनते हैं। लागू न हो तो छोड़ दें।","तुमचे पद “ऑपरेशन्स” असेल, पण उद्योगाबद्दल तुम्हाला काय माहीत आहे? मशीन, प्रक्रिया, नियम, पुरवठादार, ग्राहक, किंमती, सुरक्षा. रिक्रूटर यावरून तुम्हाला चांगले काम आणि जास्त पगारासाठी निवडतात. लागू नसेल तर सोडा."],

X.kn.sub2="ಪದವಿ ಇರಲಿ ಇಲ್ಲದಿರಲಿ, ಫ್ರೆಶರ್ ಆಗಿರಲಿ ಅನುಭವಿಯಾಗಿರಲಿ: ಎಲ್ಲರೂ ಉತ್ತಮ ಕೆಲಸಕ್ಕಾಗಿ ಪ್ರೊಫೈಲ್ ಸಲ್ಲಿಸಬಹುದು ಮತ್ತು ರಿಕ್ರೂಟರ್‌ಗಳ ಅಗತ್ಯಕ್ಕೆ ಬೇಗ ಹೊಂದಾಣಿಕೆ ಪಡೆಯಬಹುದು. ಯಾವ ಭಾಷೆಯಲ್ಲಾದರೂ ಬರೆಯಬಹುದು.";
X.bn.sub2="ডিগ্রি থাকুক বা না থাকুক, ফ্রেশার হোন বা অভিজ্ঞ: সবাই ভালো কাজের জন্য প্রোফাইল জমা দিতে পারেন এবং রিক্রুটারের চাহিদার সঙ্গে দ্রুত মিল পেতে পারেন। যেকোনো ভাষায় লিখতে পারেন।";
